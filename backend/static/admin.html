<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TicketDiary 아티스트 관리</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #e3e1dc;
    --text: #2a2a28;
    --muted: #8a8781;
    --accent: #c0562f;
    --accent-soft: #f4e3da;
    --danger: #b0473a;
    --ok: #4a7c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 14px;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; white-space: nowrap; }
  header a.nav-link { font-size: 12px; color: var(--accent); text-decoration: none; }
  header a.nav-link:hover { text-decoration: underline; }
  .field { display: flex; align-items: center; gap: 6px; }
  .field label { color: var(--muted); font-size: 12px; }
  input[type="text"], input[type="password"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    background: #fff;
    color: var(--text);
  }
  input[type="checkbox"] { accent-color: var(--accent); }
  select { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; background: #fff; color: var(--text); }
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 24px; background: var(--panel); border-bottom: 1px solid var(--border); }
  button {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--danger); border-color: var(--danger); background: #fff; }
  button.danger:hover { background: #fbecea; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  #status-line { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: #faf9f7; }
  tr:last-child td { border-bottom: none; }
  tr.row:hover { background: #faf6f2; cursor: pointer; }
  .poster-thumb { width: 44px; height: 60px; object-fit: cover; border-radius: 4px; background: var(--border); display: block; }
  .chip { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 12px; }
  .badge-flag { display: inline-block; background: var(--danger); color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 11px; margin-left: 6px; }
  .badge-llm { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 7px; font-size: 11px; margin: 2px 4px 0 0; }
  .badge-reviewed { display: inline-block; background: #e4efe7; color: var(--ok); border-radius: 999px; padding: 1px 7px; font-size: 11px; margin-left: 6px; }
  .badge-ai-reviewed { display: inline-block; background: #e8e4fb; color: #6c4fd4; border-radius: 999px; padding: 1px 7px; font-size: 11px; margin-left: 6px; }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 12px; justify-content: flex-end; }

  /* 상세 패널 */
  #overlay { display: none; position: fixed; inset: 0; background: rgba(20,18,15,0.4); align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 10; }
  #overlay.open { display: flex; }
  #detail { background: var(--panel); border-radius: 10px; width: 100%; max-width: 720px; padding: 20px; }
  #detail h2 { margin: 0 0 4px; font-size: 16px; }
  #detail .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  #detail .body { display: flex; gap: 16px; }
  #detail img.poster { width: 180px; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0; }
  .artist-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; }
  .artist-row .actions { flex-shrink: 0; white-space: nowrap; }
  .artist-row .name { font-size: 13px; }
  .artist-row .status-tag { font-size: 11px; padding: 1px 6px; border-radius: 999px; margin-left: 8px; }
  .status-matched { background: #e4efe7; color: var(--ok); }
  .status-unconfirmed { background: #efe9e0; color: var(--muted); }
  .status-ambiguous { background: #fbeadf; color: var(--accent); }
  .status-pending { background: #eee; color: var(--muted); }
  .status-suggested { background: #fdf3d8; color: #a67c00; }
  .suggestion-box { border: 1px dashed var(--border); border-radius: 6px; padding: 8px 10px; margin-top: 4px; font-size: 12px; }
  .artist-row .actions button { padding: 3px 8px; font-size: 12px; margin-left: 4px; }
  #detail .close-row { text-align: right; margin-top: 14px; }
  .ticket-links { margin: 10px 0 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .ticket-links a { display: inline-block; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; text-decoration: none; }
  .ticket-links a:hover { background: var(--accent); color: #fff; }
  /* 날짜별 출연진 */
  .lineup-box { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .lineup-box h3 { font-size: 14px; margin: 0 0 4px; }
  .lineup-box .hint { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .lineup-wrap { overflow-x: auto; }
  .lineup-table { width: auto; min-width: 100%; border-radius: 6px; }
  .lineup-table th, .lineup-table td { padding: 5px 8px; font-size: 12px; text-align: center; white-space: nowrap; }
  .lineup-table td.artist { text-align: left; white-space: normal; min-width: 140px; }
  .lineup-table th.empty-day { color: var(--danger); }
  .lineup-table td.stale { color: var(--danger); }
  .lineup-actions { margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  /* 타임테이블 직접 편집 */
  .tt-box { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .tt-box h3 { font-size: 14px; margin: 0 0 4px; }
  .tt-box .hint { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .tt-wrap { overflow-x: auto; }
  .tt-table { width: 100%; border-radius: 6px; }
  .tt-table th, .tt-table td { padding: 4px 6px; font-size: 12px; }
  .tt-table input { width: 100%; box-sizing: border-box; font-size: 12px; padding: 3px 5px; }
  .tt-table td.tt-date { width: 130px; }
  .tt-table td.tt-time { width: 90px; }
  .tt-table td.tt-stage { width: 120px; }
  .tt-table td.tt-del { width: 40px; text-align: center; }
  #msg { position: fixed; bottom: 20px; right: 20px; background: var(--text); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; display: none; z-index: 20; }
</style>
</head>
<body>

<header>
  <h1>🎫 TicketDiary 아티스트 관리</h1>
  <div class="field">
    <label>관리자 키</label>
    <input type="password" id="admin-key" placeholder="Bearer key" />
    <button onclick="saveKey()">저장</button>
  </div>
  <div class="field" style="flex:1; min-width:200px;">
    <input type="text" id="search" placeholder="공연명 / kopis_id / 아티스트 검색" style="width:100%;" />
  </div>
  <button onclick="load(1)">검색</button>
  <a class="nav-link" href="/artists">아티스트 조회 →</a>
  <a class="nav-link" href="/identity">아티스트 연결 기록 →</a>
  <a class="nav-link" href="/users">회원 삭제 →</a>
</header>

<div class="filters">
  <!-- 확인 필요 필터 - 어차피 전부 직접 검수해서 안 씀(10/21), 다시 쓰려면 아래 주석 풀고 load/resetFilters의 f-flagged도 되살리기
  <div class="field">
    <label for="f-flagged">확인 필요</label>
    <select id="f-flagged" onchange="load(1)">
      <option value="">전체</option>
      <option value="yes" selected>확인 필요만</option>
      <option value="no">확인 필요 없음만</option>
    </select>
  </div>
  -->
  <div class="field">
    <label for="f-review">검수</label>
    <select id="f-review" onchange="load(1)">
      <option value="">전체</option>
      <option value="unreviewed">검수 안 됨</option>
      <option value="done">검수 완료 (사람+AI)</option>
      <option value="human">사람 검수만</option>
      <option value="ai">AI 검수만</option>
    </select>
  </div>
  <div class="field">
    <label for="f-crawl" title="크롤링 스크린샷 재추출(찜/티켓등록 크롤링, 페스티벌 라인업 재확인) 대상 여부 - 포스터 LLM 추출 진행 상태와는 무관">크롤링 채움</label>
    <select id="f-crawl" onchange="load(1)">
      <option value="">전체</option>
      <option value="filled">크롤링으로 채워지는 공연</option>
      <option value="unfilled">크롤링으로 안 채워지는 공연</option>
    </select>
  </div>
  <div class="field">
    <label for="f-period" title="end_date 기준">진행</label>
    <select id="f-period" onchange="load(1)">
      <option value="">전체</option>
      <option value="upcoming">진행 예정</option>
      <option value="ended">종료</option>
    </select>
  </div>
  <button onclick="resetFilters()">필터 초기화</button>
</div>

<main>
  <div id="status-line"></div>
  <table>
    <thead>
      <tr><th></th><th>공연</th><th>아티스트</th><th>공연일</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="pager">
    <button onclick="prevPage()">이전</button>
    <span id="page-label"></span>
    <button onclick="nextPage()">다음</button>
  </div>
</main>

<div id="overlay" onclick="if(event.target===this) closeDetail()">
  <div id="detail"></div>
</div>
<div id="msg"></div>

<script>
const API = '/api/v1/admin';
let page = 1, pageSize = 20, totalPages = 1;
let currentDetail = null;

function adminKey() { return localStorage.getItem('td_admin_key') || ''; }
function saveKey() {
  localStorage.setItem('td_admin_key', document.getElementById('admin-key').value.trim());
  toast('키 저장됨');
}
document.getElementById('admin-key').value = adminKey();

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey(), ...(opts.headers || {}) },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `HTTP ${res.status}`);
  }
  return res.json();
}

function toast(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2500);
}

async function load(p) {
  page = p || page;
  const search = document.getElementById('search').value.trim();
  const qs = new URLSearchParams({ page, page_size: pageSize });
  if (search) qs.set('search', search);
  // for (const [param, id] of [['flagged', 'f-flagged'], ['review', 'f-review'], ['crawl', 'f-crawl'], ['period', 'f-period']]) {
  for (const [param, id] of [['review', 'f-review'], ['crawl', 'f-crawl'], ['period', 'f-period']]) {
    const v = document.getElementById(id).value;
    if (v) qs.set(param, v);
  }

  document.getElementById('status-line').textContent = '불러오는 중...';
  try {
    const data = await api('/concerts?' + qs.toString());
    renderRows(data.items);
    totalPages = Math.max(1, Math.ceil(data.total / data.page_size));
    document.getElementById('page-label').textContent = `${data.page} / ${totalPages} (총 ${data.total}건)`;
    document.getElementById('status-line').textContent = '';
  } catch (e) {
    document.getElementById('status-line').textContent = '오류: ' + e.message;
  }
}

function resetFilters() {
  // for (const id of ['f-flagged', 'f-review', 'f-crawl', 'f-period']) document.getElementById(id).value = '';
  for (const id of ['f-review', 'f-crawl', 'f-period']) document.getElementById(id).value = '';
  load(1);
}

function prevPage() { if (page > 1) load(page - 1); }
function nextPage() { if (page < totalPages) load(page + 1); }

function renderRows(items) {
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  for (const c of items) {
    const tr = document.createElement('tr');
    tr.className = 'row';
    tr.onclick = () => openDetail(c.id);
    const poster = c.poster_url ? `<img class="poster-thumb" src="${esc(c.poster_url)}" />` : '';
    const chips = (c.artist_name || []).map(n => `<span class="chip">${esc(n)}</span>`).join('');
    // 확인 필요 배지 - 필터와 같이 안 씀
    // const flag = c.flagged_count > 0 ? `<span class="badge-flag">확인 필요 ${c.flagged_count}</span>` : '';
    const flag = '';
    // admin_reviewed_at(사람)이 있으면 그걸 우선 표시, 없고 ai_reviewed_at(Claude)만 있으면 구분 표시
    const reviewed = c.admin_reviewed_at
      ? `<span class="badge-reviewed">검수완료</span>`
      : c.ai_reviewed_at
        ? `<span class="badge-ai-reviewed">AI 검수완료</span>`
        : '';
    // 수동 확인 필요(포스터 LLM 제외 사유) 배지 - 확인 필요 배지와 같이 안 씀
    // const llmReasons = (c.llm_exclusion_reasons || []).map(r => `<span class="badge-llm">수동 확인 필요: ${esc(r)}</span>`).join('');
    const llmReasons = '';
    tr.innerHTML = `
      <td>${poster}</td>
      <td>${esc(c.name)}${flag}${reviewed}<div style="color:var(--muted);font-size:11px;">${esc(c.kopis_id || '')}</div></td>
      <td>${chips}${llmReasons ? `<div>${llmReasons}</div>` : ''}</td>
      <td>${(c.start_date || '').slice(0, 10)}</td>
    `;
    tbody.appendChild(tr);
  }
}

async function openDetail(id) {
  try {
    const c = await api(`/concerts/${id}`);
    currentDetail = c;
    renderDetail(c);
    document.getElementById('overlay').classList.add('open');
  } catch (e) {
    toast('오류: ' + e.message);
  }
}
function closeDetail() { document.getElementById('overlay').classList.remove('open'); }

function renderDetail(c) {
  const poster = c.poster_url ? `<img class="poster" src="${esc(c.poster_url)}" />` : '';
  const links = Object.entries(c.ticketing_links || {})
    .map(([site, url]) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(site)} 예매 ↗</a>`)
    .join('');
  const rows = (c.artist_name || []).map(name => {
    const statusRow = (c.statuses || []).find(s => s.artist_text === name);
    const st = statusRow ? statusRow.status : null;
    const tag = st ? `<span class="status-tag status-${st}">${st}</span>` : '';
    const members = (c.group_memberships || {})[name];
    const memberLine = members && members.length
      ? `<div style="color:var(--muted); font-size:11px; margin-top:2px;">멤버: ${members.map(esc).join(', ')}</div>`
      : '';
    // MusicBrainz에 없는 아티스트(인디 등)는 ambiguous/unconfirmed에서 영영 못 벗어남 -
    // 표기 자체는 이미 맞으니 수정 없이 그대로 확정(user_input canonical 등록)하는 버튼
    const confirmBtn = (st === 'ambiguous' || st === 'unconfirmed')
      ? `<button onclick="submitConfirm(this)" title="MusicBrainz에 없는 아티스트라도 표기가 맞으면 그대로 확정 처리">확정</button>`
      : '';
    // 동명이인 오병합 방지 - mbid 없는 수동 별칭과 문자열만 일치한 경우라 자동 병합 대신 여기서
    // 직접 확인받음(같은 사람이면 병합 적용, 아니면 별개 인물로 남김)
    const suggestionBox = st === 'suggested'
      ? `<div class="suggestion-box">"${esc(statusRow.suggested_name)}"와 같은 사람인가요?
          <button onclick="submitSuggestion(this, true)">맞음, 병합</button>
          <button onclick="submitSuggestion(this, false)">다른 사람</button>
        </div>`
      : '';
    return `
      <div class="artist-row" data-concert-id="${c.id}" data-name="${esc(name)}">
        <div style="flex:1;">
          <span class="name">${esc(name)}${tag}</span>
          ${memberLine}
          ${suggestionBox}
        </div>
        <span class="actions">
          ${confirmBtn}
          <button onclick="startRename(this)">수정</button>
          <button onclick="startDisplayName(this)">표시명</button>
          <button onclick="startAddAlias(this)">별칭 추가</button>
          <button onclick="startReassign(this)" title="동명이인 오매칭(텍스트는 같은데 실존 인물이 다름) 강제 수정 - 검색해서 올바른 아티스트로 재지정">재지정</button>
          <button class="danger" onclick="startDeleteConfirm(this)">삭제</button>
        </span>
      </div>`;
  }).join('');

  // admin_reviewed_at(사람)이 있으면 그것만 보여줌. ai_reviewed_at(Claude)만 있으면 그 사실을
  // 같이 보여주되, 사람이 직접 재검수할 수 있게 버튼은 그대로 둠
  const reviewStatus = c.admin_reviewed_at
    ? `<span class="badge-reviewed">검수완료 (${esc(c.admin_reviewed_at.slice(0, 16).replace('T', ' '))})</span>`
    : `${c.ai_reviewed_at ? `<span class="badge-ai-reviewed">AI 검수완료 (${esc(c.ai_reviewed_at.slice(0, 16).replace('T', ' '))})</span> ` : ''}<button onclick="submitMarkReviewed()">${c.ai_reviewed_at ? '사람 검수로 표시' : '검수 완료로 표시'}</button>`;

  // event_type이 이미 FESTIVAL이면 자동으로 라인업 재확인 대상이라 버튼 자체가 불필요
  const festivalButton = c.event_type !== 'FESTIVAL'
    ? `<button onclick="submitMarkFestival()" style="margin-left:8px;" title="event_type을 FESTIVAL로 바꿔 라인업 재확인 배치(24시간마다) 대상에 편입시킴 - LLM 전송은 자정 배치가 알아서 하므로 여기선 안 건드림, 검수완료로도 안 바뀜">페스티벌로 지정</button>`
    : '';

  document.getElementById('detail').innerHTML = `
    <h2>${esc(c.name)}</h2>
    <div class="sub">${esc(c.kopis_id || '')} · ${esc(c.venue || '')} · ${(c.start_date || '').slice(0, 10)}</div>
    <div style="margin-bottom:10px;">${reviewStatus}${festivalButton}</div>
    ${links ? `<div class="ticket-links">${links}</div>` : ''}
    <div class="body">
      ${poster}
      <div style="flex:1;">
        ${rows || '<div style="color:var(--muted)">아티스트 없음</div>'}
        <div class="artist-row" data-concert-id="${c.id}" style="border-style:dashed;">
          <input type="text" class="add-input" placeholder="놓친 아티스트명 입력" style="flex:1; margin-right:8px; border:none;" />
          <button onclick="submitAdd(this)">추가</button>
        </div>
        ${(c.artist_name || []).length >= 2 ? `<div style="margin-top:6px;"><button onclick="startGroupCleanup()">밴드 멤버 정리</button></div>` : ''}
        <div id="group-cleanup-area"></div>
      </div>
    </div>
    ${renderLineup(c)}
    ${renderTimetable(c)}
    <div class="close-row"><button onclick="closeDetail()">닫기</button></div>
  `;
  const addInput = document.querySelector('.add-input');
  addInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitAdd(addInput);
  });
}

// 여러 날 공연의 날짜별 출연진 - 행=아티스트, 열=날짜 체크표. 체크가 하나도 없는 날은 앱에서 그날도
// 전체 아티스트로 보임(배정 모름). 저장하면 통째로 관리자 배정이 되고 이후 LLM 자동 결과는 안 섞임
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
function dayLabel(d) {
  const [y, m, dd] = d.split('-').map(Number);
  return `${String(m).padStart(2, '0')}.${String(dd).padStart(2, '0')} (${WEEKDAYS[new Date(y, m - 1, dd).getDay()]})`;
}

function renderLineup(c) {
  const days = c.days || [];
  if (!days.length) return '';
  const lineup = c.lineup || [];
  const assigned = new Set(lineup.map(e => `${e.artist}|${e.performance_date}`));
  const names = c.artist_name || [];
  // 아티스트 목록에서 빠졌는데 배정에 남은 표기(이름 수정·삭제 전 것) - 저장하면 지워짐
  const stale = [...new Set(lineup.map(e => e.artist))].filter(n => !names.includes(n));
  const sources = new Set(lineup.map(e => e.source));
  const state = !lineup.length
    ? '배정 없음 - 앱에서 모든 날 전체 아티스트로 보여요'
    : sources.has('admin')
      ? '관리자 배정 - LLM 자동 결과는 더 안 섞여요'
      : `자동 배정(${[...sources].map(s => s === 'crawl' ? '예매처 크롤링' : s === 'poster' ? '포스터' : s).join('·')}) - 저장하면 관리자 배정으로 바뀌어요`;

  const head = days.map(d => {
    const empty = !lineup.some(e => e.performance_date === d);
    return `<th class="${empty ? 'empty-day' : ''}" title="${empty ? '배정 없음 - 이 날은 전체 아티스트로 보임' : ''}">${dayLabel(d)}<br><button onclick="toggleLineupDay('${d}')" style="padding:1px 6px;font-size:11px;margin-top:2px;">전체</button></th>`;
  }).join('');
  const body = names.map(n => `
    <tr data-artist="${esc(n)}"><td class="artist">${esc(n)}</td>${days.map(d =>
      `<td><input type="checkbox" data-day="${d}" ${assigned.has(`${n}|${d}`) ? 'checked' : ''} /></td>`).join('')}</tr>`).join('');
  const staleRows = stale.map(n => `
    <tr><td class="artist stale" title="아티스트 목록에 없는 표기 - 저장하면 배정에서 빠짐">${esc(n)} (목록에 없음)</td>${days.map(d =>
      `<td>${assigned.has(`${n}|${d}`) ? '●' : ''}</td>`).join('')}</tr>`).join('');

  return `
    <div class="lineup-box" id="lineup-box">
      <h3>날짜별 출연진</h3>
      <div class="hint">${esc(state)}. 체크가 없는 날(빨간 날짜)은 앱에서 그날도 전체 아티스트로 보여요.</div>
      ${names.length ? `
        <div class="lineup-wrap"><table class="lineup-table">
          <thead><tr><th></th>${head}</tr></thead>
          <tbody>${body}${staleRows}</tbody>
        </table></div>
        <div class="lineup-actions">
          <button class="primary" onclick="submitLineup()">날짜별 출연진 저장</button>
          ${lineup.length ? `<button onclick="submitLineup(true)" title="배정을 전부 지워 모든 날 전체 아티스트로 보이게 하고, LLM 자동 채움도 다시 받음">배정 비우기</button>` : ''}
        </div>` : '<div style="color:var(--muted)">아티스트를 먼저 채워 주세요</div>'}
    </div>`;
}

// 타임테이블 직접 만들기·고치기 - 저장하면 관리자 편집으로 표시돼 이후 LLM 크롤링 결과가 덮어쓰지 않음.
// 항목은 LLM 추출 형식 그대로(날짜·시간·무대는 비워도 되고, 시간은 내용(event) 글자 안에 써도 됨)
function ttRowHtml(e) {
  return `<tr>
    <td class="tt-date"><input type="date" data-f="date" value="${esc(e.date || '')}" /></td>
    <td class="tt-time"><input type="text" data-f="time" placeholder="18:00" value="${esc(e.time || '')}" /></td>
    <td class="tt-stage"><input type="text" data-f="stage" placeholder="무대" value="${esc(e.stage || '')}" /></td>
    <td><input type="text" data-f="event" placeholder="예: 밴드A 18:00 - 18:40" value="${esc(e.event || '')}" /></td>
    <td class="tt-del"><button class="danger" onclick="this.closest('tr').remove()" style="padding:1px 6px;">×</button></td>
  </tr>`;
}

function renderTimetable(c) {
  const rows = c.timetable || [];
  const state = c.timetable_admin_edited
    ? '관리자 편집 - LLM 자동 결과가 덮어쓰지 않아요'
    : rows.length
      ? '자동 추출 결과 - 저장하면 관리자 편집으로 바뀌어 LLM 결과가 더 안 덮어써요'
      : '타임테이블 없음';
  return `
    <div class="tt-box" id="tt-box">
      <h3>타임테이블</h3>
      <div class="hint">${esc(state)}. 날짜·시간·무대는 비워도 돼요.</div>
      <div class="tt-wrap"><table class="tt-table">
        <thead><tr><th>날짜</th><th>시간</th><th>무대</th><th>내용</th><th></th></tr></thead>
        <tbody id="tt-rows">${rows.map(ttRowHtml).join('')}</tbody>
      </table></div>
      <div class="lineup-actions">
        <button onclick="addTimetableRow()">행 추가</button>
        <button class="primary" onclick="submitTimetable()">타임테이블 저장</button>
        ${c.timetable_admin_edited ? `<button onclick="releaseTimetable()" title="내용은 그대로 두고 편집 표시만 풀어, 이후 LLM 크롤링 결과가 다시 덮어쓸 수 있게 함">자동 채움 재개</button>` : ''}
      </div>
    </div>`;
}

// 새 행은 바로 위 행의 날짜·무대를 이어받음(같은 날 여러 줄 입력이 많아서)
function addTimetableRow() {
  const tbody = document.getElementById('tt-rows');
  const last = tbody.lastElementChild;
  const get = (f) => (last ? last.querySelector(`[data-f="${f}"]`).value : '');
  const days = currentDetail.days || [];
  tbody.insertAdjacentHTML('beforeend', ttRowHtml({
    date: get('date') || (days.length ? days[0] : (currentDetail.start_date || '').slice(0, 10)),
    stage: get('stage'),
  }));
  tbody.lastElementChild.querySelector('[data-f="time"]').focus();
}

async function submitTimetable() {
  const entries = [...document.querySelectorAll('#tt-rows tr')]
    .map(tr => Object.fromEntries([...tr.querySelectorAll('[data-f]')].map(i => [i.dataset.f, i.value.trim() || null])))
    .filter(e => e.event || e.date || e.time || e.stage);
  if (entries.some(e => !e.event)) { toast('내용이 빈 행이 있어요'); return; }
  if (!entries.length && !confirm('항목이 하나도 없어요. 타임테이블을 비운 채로 저장할까요?')) return;
  try {
    const c = await api(`/concerts/${currentDetail.id}/timetable`, { method: 'PUT', body: JSON.stringify({ entries }) });
    currentDetail = c;
    renderDetail(c);
    toast('타임테이블 저장됨');
  } catch (e) {
    toast('오류: ' + e.message);
  }
}

async function releaseTimetable() {
  try {
    const c = await api(`/concerts/${currentDetail.id}/timetable/admin-edit`, { method: 'DELETE' });
    currentDetail = c;
    renderDetail(c);
    toast('자동 채움 재개');
  } catch (e) {
    toast('오류: ' + e.message);
  }
}

// 그 날짜 칸을 전부 켜거나(하나라도 꺼져 있으면) 전부 끔
function toggleLineupDay(day) {
  const boxes = [...document.querySelectorAll(`#lineup-box input[data-day="${day}"]`)];
  const turnOn = boxes.some(b => !b.checked);
  boxes.forEach(b => b.checked = turnOn);
}

async function submitLineup(clear = false) {
  const concertId = currentDetail.id;
  const entries = clear ? [] : [...document.querySelectorAll('#lineup-box tr[data-artist]')].flatMap(tr =>
    [...tr.querySelectorAll('input:checked')].map(b => ({ artist: tr.dataset.artist, performance_date: b.dataset.day })));
  if (clear && !confirm('날짜별 배정을 전부 지울까요? 모든 날이 전체 아티스트로 보여요.')) return;
  try {
    const c = await api(`/concerts/${concertId}/lineup`, { method: 'PUT', body: JSON.stringify({ entries }) });
    currentDetail = c;
    renderDetail(c);
    toast(clear ? '배정 비움' : '날짜별 출연진 저장됨');
  } catch (e) {
    toast('오류: ' + e.message);
  }
}

async function submitAdd(el) {

// 실제로는 페스티벌인데 event_type이 아니라서 크롤링/포스터 파이프라인 어느 쪽 자동 대상도

// 아티스트가 아직 안 채워진 상태이므로 검수 완료로도 표시하지 않음(review 엔드포인트 호출 안 함)

// "밴드명 + 멤버 여러 명"이 개별 표기로 뽑힌 공연을 밴드명 하나로 접는 UI. currentDetail의
// artist_name 전체를 라디오(밴드 하나 선택)+체크박스(멤버로 접을 이름들)로 보여줌
function startGroupCleanup() {
  const c = currentDetail;
  const names = c.artist_name || [];
  document.getElementById('group-cleanup-area').innerHTML = `
    <div style="border:1px dashed var(--border); border-radius:6px; padding:10px; margin-top:6px;">
      <div style="font-size:12px; color:var(--muted); margin-bottom:6px;">밴드명 하나 선택 + 멤버로 접을 이름 체크</div>
      ${names.map(n => `
        <label style="display:flex; align-items:center; gap:6px; margin-bottom:4px; font-size:13px;">
          <input type="radio" name="group-pick" value="${esc(n)}" />
          <input type="checkbox" class="member-pick" value="${esc(n)}" />
          ${esc(n)}
        </label>
      `).join('')}
      <div style="margin-top:8px;">
        <button onclick="submitGroupCleanup()">적용</button>
        <button onclick="document.getElementById('group-cleanup-area').innerHTML=''">취소</button>
      </div>
    </div>`;
}

async function submitGroupCleanup() {
  const groupRadio = document.querySelector('input[name="group-pick"]:checked');
  if (!groupRadio) { toast('밴드명을 선택하세요'); return; }
  const groupName = groupRadio.value;
  const memberNames = [...document.querySelectorAll('.member-pick:checked')]
    .map(el => el.value)
    .filter(v => v !== groupName);
  if (memberNames.length === 0) { toast('멤버를 1명 이상 체크하세요'); return; }
  const concertId = currentDetail.id;
  try {
    await api(`/concerts/${concertId}/group-membership`, {
      method: 'POST',
      body: JSON.stringify({ group_name: groupName, member_names: memberNames }),
    });
    toast('밴드로 정리됨');
    openDetail(concertId);
    load(page);
  } catch (e) {
    toast('오류: ' + e.message);
  }
}

// prompt()/confirm() 네이티브 다이얼로그는 브라우저가 몇 번 닫으면("이 페이지에서 다시
// 표시 안 함") 이후 호출을 조용히 막아버려서 실사용 중 먹통처럼 보이는 문제가 있었음 -
// 그 자리에서 바로 입력/확인하는 인라인 UI로 교체

// 아티스트명을 onclick 문자열 인자로 직접 넣으면 JSON.stringify가 만드는 큰따옴표가
// onclick="..."의 큰따옴표와 충돌해서 속성 자체가 깨짐(따옴표/특수문자 있는 이름마다 버튼이
// 먹통이 됨) - data-* 속성에 담아두고 클릭 시 DOM에서 읽어오는 방식으로 이 문제를 피한다
function startRename(button) {
  const row = button.closest('.artist-row');
  const concertId = row.dataset.concertId;
  const originalName = row.dataset.name;
  row.innerHTML = `
    <input type="text" class="rename-input" value="${esc(originalName)}" style="flex:1; margin-right:8px;" />
    <span class="actions">
      <button onclick="submitRename(this)">저장</button>
      <button onclick="openDetail('${concertId}')">취소</button>
    </span>`;
  const input = row.querySelector('.rename-input');
  input.focus();
  input.select();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitRename(input);
    if (e.key === 'Escape') openDetail(concertId);
  });
}

async function submitRename(el) {
  const row = el.closest('.artist-row');
  const concertId = row.dataset.concertId;
  const originalName = row.dataset.name;
  const next = row.querySelector('.rename-input').value.trim();
  if (!next || next === originalName) { openDetail(concertId); return; }
  try {
    await api(`/concerts/${concertId}/artist-name`, {
      method: 'PATCH',
      body: JSON.stringify({ original_name: originalName, confirmed_name: next }),
    });
    toast('수정됨');
    openDetail(concertId);
    load(page);
  } catch (e) {
    toast('오류: ' + e.message);
  }
}

// 표기를 바꾸지 않고 그대로 확정 - rename과 같은 엔드포인트를 original_name===confirmed_name으로
// 호출(confirm_artist_name_change가 이 경우도 정상 처리: mbid=NULL canonical 등록 + status
// matched 전환). submitRename은 이름이 같으면 API 호출 자체를 건너뛰므로 별도 함수로 분리함
async function submitConfirm(button) {
  const row = button.closest('.artist-row');

  try {
    await api(`/concerts/${concertId}/artist-name`, {

    });
    toast('확정됨');
    openDetail(concertId);
    load(page);
  } catch (e) {
    toast('오류: ' + e.message);
  }
}

// 동명이인 방지 확인 응답 - accept=true면 제안된 canonical로 병합, false면 별개 인물로 거부
// (같은 표기가 다른 공연에서 또 나오면 그때 다시 물어봄, 여기서 영구 차단하지 않음)

// canonical_id는 UUID라 따옴표/특수문자 걱정 없이 onclick 인자로 바로 넣어도 안전
async function startDisplayName(button) {
  const row = button.closest('.artist-row');

}

}

async function submitAddAlias(el, canonicalId) {
  const row = el.closest('.artist-row');

    });
    toast('별칭 추가됨');
    openDetail(concertId);
  } catch (e) {
    toast('오류: ' + e.message);
  }
}

// 동명이인 오매칭(텍스트는 같은데 실존 인물이 다름, 예: LiSA→블랙핑크 Lisa) 강제 수정용 -
// 이름을 다시 입력해도 fuzzy/alias 매칭이 또 같은 틀린 canonical로 가버려서, 검색해서
// canonical_id를 직접 골라 재지정한다(admin.py reassign_artist_to_canonical 참고)
function startReassign(button) {
  const row = button.closest('.artist-row');
  const concertId = row.dataset.concertId;
  const name = row.dataset.name;
  row.innerHTML = `
    <div style="flex:1;">
      <div style="display:flex; margin-bottom:6px;">
        <input type="text" class="reassign-search" placeholder="올바른 아티스트 이름 또는 MBID 검색" style="flex:1; margin-right:8px;" value="${esc(name)}" />
        <button onclick="searchReassignCandidates(this)">검색</button>
      </div>
      <div class="reassign-results" style="font-size:12px;"></div>
      <div style="margin-top:6px; font-size:12px; color:var(--muted);">위 결과 중에 없으면(검색 결과가 있어도 전부 다른 사람이면) 신규 등록:</div>
      <div style="display:flex; flex-wrap:wrap; align-items:center; margin-top:4px;">
        <input type="text" class="register-new-name" placeholder="새 아티스트명(비우면 위 표기 그대로)" style="flex:1 1 160px; min-width:0; margin-right:6px; margin-bottom:4px;" />
        <button onclick="submitRegisterNew(this)" title="이 표기를 신규 아티스트로 등록" style="flex-shrink:0; white-space:nowrap;">신규 등록</button>
      </div>
      <label style="display:flex; align-items:center; gap:4px; margin-top:4px; font-size:11px; color:var(--muted);">
        <input type="checkbox" class="register-new-force" />
        이름이 기존 아티스트와 완전히 똑같아도 동명이인이니 무조건 새로 만들기
      </label>
    </div>
    <span class="actions">
      <button onclick="openDetail('${concertId}')">취소</button>
    </span>`;
  const input = row.querySelector('.reassign-search');
  input.focus();
  input.select();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchReassignCandidates(input);
    if (e.key === 'Escape') openDetail(concertId);
  });
}

async function searchReassignCandidates(el) {
  const row = el.closest('.artist-row');
  const resultsBox = row.querySelector('.reassign-results');
  const q = row.querySelector('.reassign-search').value.trim();
  if (!q) return;
  resultsBox.textContent = '검색 중...';
  let data;
  try {
    data = await api(`/artists?search=${encodeURIComponent(q)}&page_size=8`);
  } catch (e) {
    resultsBox.textContent = '오류: ' + e.message;
    return;
  }
  // MBID를 넣었는데 DB에 아직 없는 아티스트면 MusicBrainz에서 가져와 만들면서 재지정
  const mbid = MBID_PATTERN.test(q) ? q.toLowerCase() : null;
  const mbidOption = mbid && !data.items.some(a => a.mbid === mbid) ? `
    <div style="display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border); border-radius:6px; padding:4px 8px; margin-bottom:4px;">
      <span>MBID ${esc(mbid)} <span style="color:var(--muted);">[DB에 없음 - MusicBrainz에서 가져옴]</span></span>
      <button onclick="submitReassign(this, null, '${mbid}')">이걸로 재지정</button>
    </div>` : '';
  if (!data.items.length && !mbidOption) {
    resultsBox.textContent = '검색 결과 없음';
    return;
  }
  resultsBox.innerHTML = mbidOption + data.items.map(a => `
    <div style="display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border); border-radius:6px; padding:4px 8px; margin-bottom:4px;">
      <span>${esc(a.display_name || a.canonical_name)}${a.display_name ? ` <span style="color:var(--muted);">(${esc(a.canonical_name)})</span>` : ''}${a.mbid ? '' : ' <span style="color:var(--muted);">[MusicBrainz 미연동]</span>'}</span>
      <button onclick="submitReassign(this, '${a.id}')">이걸로 재지정</button>
    </div>`).join('');
}

const MBID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

async function submitReassign(button, canonicalId, mbid = null) {
  const row = button.closest('.artist-row');
  const concertId = row.dataset.concertId;
  const artistText = row.dataset.name;
  if (mbid) button.disabled = true;  // MusicBrainz 조회가 몇 초 걸려서 중복 클릭 방지
  try {
    await api(`/concerts/${concertId}/artist-name/reassign`, {
      method: 'POST',
      body: JSON.stringify({ artist_text: artistText, canonical_id: canonicalId, mbid }),
    });
    toast('재지정됨');
    openDetail(concertId);
    load(page);
  } catch (e) {
    toast('오류: ' + e.message);
  }
}

// 재지정 검색에도 안 나오는(MusicBrainz/canonical_artists에 없는) 아티스트를 신규로 등록
async function submitRegisterNew(button) {
  const row = button.closest('.artist-row');
  const concertId = row.dataset.concertId;
  const artistText = row.dataset.name;
  const newName = row.querySelector('.register-new-name').value.trim();
  const forceNew = row.querySelector('.register-new-force').checked;
  try {
    await api(`/concerts/${concertId}/artist-name/register-new`, {
      method: 'POST',
      body: JSON.stringify({ artist_text: artistText, new_name: newName || null, force_new: forceNew }),
    });
    toast('신규 등록됨');
    openDetail(concertId);
    load(page);
  } catch (e) {
    toast('오류: ' + e.message);
  }
}

function startDeleteConfirm(button) {
  const row = button.closest('.artist-row');
  const concertId = row.dataset.concertId;
  const actions = button.closest('.actions');
  actions.innerHTML = `
    <span style="font-size:12px; color:var(--danger); margin-right:6px;">삭제할까요?</span>
    <button class="danger" onclick="submitDelete(this, false)">삭제만</button>
    <button class="danger" onclick="submitDelete(this, true)" title="이 이름이 다른 콘서트에서 또 잘못 추출돼도 자동으로 걸러지게 함">삭제+차단</button>
    <button onclick="openDetail('${concertId}')">취소</button>`;
}

async function submitDelete(button, blocklist) {
  const row = button.closest('.artist-row');
  const concertId = row.dataset.concertId;
  const name = row.dataset.name;
  try {
    const qs = new URLSearchParams({ name, blocklist });
    await api(`/concerts/${concertId}/artist-name?${qs.toString()}`, { method: 'DELETE' });
    toast(blocklist ? '삭제+차단됨(다음부터 자동으로 안 뽑힘)' : '삭제됨');
    openDetail(concertId);
    load(page);
  } catch (e) {
    toast('오류: ' + e.message);
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

load(1);
</script>
</body>
</html>
