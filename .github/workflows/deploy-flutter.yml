name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - feature/build # feature/build 브랜치에 push가 일어나면 자동으로 로봇 작동

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build web --release --base-href "/TicketDiary/"

      # 최신 만료되지 않은 v4 버전을 사용하여 결과물을 업로드합니다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 최신 만료되지 않은 v4 버전을 사용하여 깃허브 페이지스로 배포합니다.
      - id: deployment
        uses: actions/deploy-pages@v4
