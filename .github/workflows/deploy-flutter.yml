name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - feature/build # feature/build 브랜치에 push가 일어나면 자동으로 로봇 작동

# 🌟 로봇이 모든 명령어를 Prontend 폴더 안으로 들어가서 실행하도록 강제합니다.
defaults:
  run:
    working-directory: Prontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/TicketDiary/"

      - uses: actions/upload-pages-artifact@v3
        with:
          # 업로드할 파일의 경로도 Prontend 폴더 기준으로 잡아줍니다.
          path: Prontend/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
