name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - feature/build # feature/build 브랜치에 push가 일어나면 자동으로 로봇 작동

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/TicketDiary/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web # 맨 바깥 폴더 기준으로 다시 경로 원상복구

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
