include: package:flutter_lints/flutter.yaml

# 빌드 과정에서 내려받은 SDK·플러그인 예제는 앱 소스가 아닙니다.
analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - ios/Pods/**
    - ios/.symlinks/**
    - macos/Pods/**
    - macos/.symlinks/**

linter:
  rules:
    prefer_typing_uninitialized_variables: false
    prefer_const_constructors_in_immutables: false
    prefer_const_constructors: false
    avoid_print: false
